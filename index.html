<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>CORE BOUNCE - STAGE THEMES V6</title>
<style>

:root{--bg:#07111e;--panel:#0d1e31;--line:#65e9ff;--text:#f4fbff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#030912;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
body{touch-action:none}
#app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(circle at 50% 20%,#102c45 0,#07111e 45%,#02070d 100%)}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid rgba(101,233,255,.2)}
.title{font-weight:900;letter-spacing:.12em}
.sub{font-size:10px;opacity:.55;letter-spacing:.12em}
.hudWrap{display:flex;align-items:center;gap:10px}
.hud{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;font-weight:700;line-height:1.25}
.soundBtn{width:38px;height:38px;border-radius:12px;border:1px solid rgba(101,233,255,.35);background:rgba(10,28,47,.9);color:#fff;font-size:18px}
main{position:relative;min-height:0}
canvas{width:100%;height:100%;display:block}
footer{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
footer button{height:56px;border:1px solid rgba(101,233,255,.4);border-radius:16px;background:linear-gradient(#12304c,#0a1c2f);color:#eaffff;font-weight:900;font-size:16px;box-shadow:inset 0 0 20px rgba(101,233,255,.08)}
footer button:active{transform:translateY(1px);filter:brightness(1.25)}
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,4,10,.76);backdrop-filter:blur(8px);z-index:4;padding:20px}
.overlay.show{display:flex}
.panel{width:min(360px,92vw);padding:28px;border-radius:24px;background:linear-gradient(180deg,rgba(15,37,59,.96),rgba(7,18,31,.98));border:1px solid rgba(101,233,255,.35);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45), inset 0 0 30px rgba(101,233,255,.05)}
.panel h1,.panel h2{margin:.3em 0;letter-spacing:.08em}
.panel p{line-height:1.7;opacity:.9}
.panel small{display:block;margin-top:16px;line-height:1.6;opacity:.65}
.panel button{margin-top:8px;width:100%;height:54px;border:none;border-radius:14px;font-weight:900;font-size:18px;color:#03101a;background:linear-gradient(90deg,#6ff0ff,#8effb5)}
.logoOrb{width:72px;height:72px;margin:0 auto 8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 8%,#9df7ff 15%,#38c4ff 38%,#1a64ff 66%,#0e143b 100%);box-shadow:0 0 30px #43e8ff,0 0 70px rgba(67,232,255,.35)}

</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="title">CORE BOUNCE</div>
      <div class="sub">STAGE THEMES V6</div>
    </div>
    <div class="hudWrap">
      <div class="hud">
        <span id="stage">STAGE 1</span>
        <span id="score">SCORE 000000</span>
        <span id="lives">CORE × 3</span>
      </div>
      <button id="soundBtn" class="soundBtn" aria-label="sound">🔊</button>
    </div>
  </header>

  <main>
    <canvas id="game"></canvas>

    <div id="startScreen" class="overlay show">
      <div class="panel">
        <div class="logoOrb"></div>
        <h1>CORE BOUNCE</h1>
        <p>序盤は長いフリッパーで固定。<br>進むほど短くなり、移動も解禁。特別ステージも登場。</p>
        <button id="startBtn" type="button" onclick="startGame()">START</button>
        <small>左半分タップ：左フリッパー / 右半分タップ：右フリッパー<br>STAGE 1はモンスター1発で撃破</small>
      </div>
    </div>

    <div id="gameOver" class="overlay">
      <div class="panel">
        <h2 id="resultTitle">SYSTEM DOWN</h2>
        <p id="finalScore">SCORE 0</p>
        <button id="retryBtn" type="button" onclick="startGame()">RETRY</button>
      </div>
    </div>
  </main>

  <footer>
    <button id="leftBtn" aria-label="left flipper">◀ LEFT</button>
    <button id="rightBtn" aria-label="right flipper">RIGHT ▶</button>
  </footer>
</div>
<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const stageEl = document.getElementById("stage");
const startScreen = document.getElementById("startScreen");
const gameOver = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");
const resultTitle = document.getElementById("resultTitle");
const startBtn = document.getElementById("startBtn");
const retryBtn = document.getElementById("retryBtn");
const soundBtn = document.getElementById("soundBtn");

let W=0,H=0,dpr=1;
let running=false;
let score=0,lives=3,stage=1;
let leftPressed=false,rightPressed=false;
let shake=0,last=0;
let particles=[],debris=[],bumpers=[],bars=[],monsters=[];
let combo=0,comboTimer=0,stageMessageTimer=0;

const ball={x:0,y:0,r:11,vx:0,vy:0};
const flippers={
  left:{x:0,y:0,len:74,angle:-0.3,rest:-0.3,active:-0.95},
  right:{x:0,y:0,len:74,angle:Math.PI+0.3,rest:Math.PI+0.3,active:Math.PI+0.95}
};

let flipperShift = 0;
let flipperDragging = false;
let flipperDragStartX = 0;
let flipperShiftStart = 0;

function stageRules(){
  // 序盤はやさしく、進むほど落ちやすくする。
  if(stage<=2){
    return {len:92, movable:false, sideDrain:.22, centerDrain:.025, guideEnd:.30, bounceMin:500, bounceMax:640};
  }
  if(stage<=4){
    return {len:86, movable:false, sideDrain:.25, centerDrain:.04, guideEnd:.28, bounceMin:520, bounceMax:660};
  }
  if(stage<=6){
    return {len:80, movable:true, sideDrain:.29, centerDrain:.055, guideEnd:.27, bounceMin:535, bounceMax:680};
  }
  if(stage<=9){
    return {len:74, movable:true, sideDrain:.33, centerDrain:.07, guideEnd:.25, bounceMin:550, bounceMax:700};
  }
  return {len:68, movable:true, sideDrain:.36, centerDrain:.085, guideEnd:.23, bounceMin:565, bounceMax:720};
}

function stageTheme(){
  const cycle=(stage-1)%6;
  if(cycle===2) return "color";
  if(cycle===4) return "fire";
  if(cycle===5) return "neon";
  return "normal";
}

function applyFlipperPositions(){
  const rules=stageRules();
  flippers.left.len=rules.len;
  flippers.right.len=rules.len;

  // 固定ステージでは中央へ戻す。移動解禁後だけ左右へ動かせる。
  if(!rules.movable) flipperShift=0;

  const maxShift = W * 0.16;
  flipperShift = clamp(flipperShift, -maxShift, maxShift);
  flippers.left.x = W*.44 + flipperShift;
  flippers.right.x = W*.56 + flipperShift;
  flippers.left.y = flippers.right.y = H-78;
}


// ------------ AUDIO ------------
let audioCtx=null, masterGain=null, musicTimer=null, audioEnabled=true;
function initAudio(){
  try{
    if(audioCtx){
      if(audioCtx.state==="suspended") audioCtx.resume();
      return true;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return false;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.22;
    masterGain.connect(audioCtx.destination);
    return true;
  }catch(e){
    audioEnabled=false;
    if(soundBtn) soundBtn.textContent="🔇";
    return false;
  }
}
function tone(freq=440,duration=.08,type="sine",volume=.18,slideTo=null){
  if(!audioEnabled) return;
  initAudio();
  const now=audioCtx.currentTime;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(freq, now);
  if(slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), now+duration);
  gain.gain.setValueAtTime(.0001, now);
  gain.gain.exponentialRampToValueAtTime(volume, now+.01);
  gain.gain.exponentialRampToValueAtTime(.0001, now+duration);
  osc.connect(gain); gain.connect(masterGain);
  osc.start(now); osc.stop(now+duration+.03);
}
function noise(duration=.08, volume=.05){
  if(!audioEnabled) return;
  initAudio();
  const len=Math.floor(audioCtx.sampleRate*duration);
  const buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<len;i++) data[i]=(Math.random()*2-1)*(1-i/len);
  const src=audioCtx.createBufferSource();
  const g=audioCtx.createGain();
  g.gain.value=volume;
  src.buffer=buf; src.connect(g); g.connect(masterGain); src.start();
}
const sfx={
  flip:()=>tone(145,.055,"square",.10,230),
  bumper:()=>{tone(620,.07,"sine",.13,900);setTimeout(()=>tone(930,.05,"sine",.08),35)},
  bar:()=>{tone(520,.06,"square",.09,820); setTimeout(()=>tone(340,.04,"square",.05),28)},
  hit:()=>{tone(240,.09,"sawtooth",.12,150);noise(.05,.035)},
  crack:()=>{tone(180,.07,"square",.11,90);noise(.06,.045)},
  down:()=>{tone(520,.09,"square",.11,760);setTimeout(()=>tone(780,.10,"square",.10,1100),70)},
  stage:()=>[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.14,"triangle",.10),i*100)),
  lost:()=>{tone(330,.12,"sine",.11,220);setTimeout(()=>tone(220,.18,"sine",.09,110),110)},
  gameover:()=>[330,277,220,165].forEach((f,i)=>setTimeout(()=>tone(f,.23,"triangle",.10),i*140))
};
function stopMusic(){ if(musicTimer){ clearInterval(musicTimer); musicTimer=null; } }
function startMusic(){
  stopMusic();
  if(!audioEnabled) return;
  initAudio();
  let step=0;
  const notes=[110,0,165,0,147,0,196,0,110,0,220,0,165,0,147,0];
  musicTimer=setInterval(()=>{
    if(!running || !audioEnabled) return;
    const f=notes[step%notes.length];
    if(f) tone(f,.18,"triangle",.035);
    if(step%4===0) tone(55,.11,"sine",.025);
    step++;
  },230);
}
function setAudio(on){
  audioEnabled=on;
  soundBtn.textContent=on?"🔊":"🔇";
  if(on){ initAudio(); if(running) startMusic(); } else stopMusic();
}
soundBtn.onclick=()=>setAudio(!audioEnabled);

// ------------ UTILS ------------
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function rand(a,b){ return a + Math.random()*(b-a); }
function addGlowBurst(x,y,n=10,color="#9bf5ff"){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=40+Math.random()*140;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.35,size:3+Math.random()*2,color});
  }
}
function addDebris(x,y,color,count=12,size=4){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,s=60+Math.random()*190;
    debris.push({
      x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.45+Math.random()*.55,size:size*(.5+Math.random()*1.2),
      rot:Math.random()*Math.PI*2,vr:rand(-8,8),color
    });
  }
}
function speedUpBall(minSpeed){
  const sp = Math.hypot(ball.vx, ball.vy);
  if(sp < minSpeed && sp > 0){
    ball.vx = ball.vx / sp * minSpeed;
    ball.vy = ball.vy / sp * minSpeed;
  }
}

// ------------ SETUP ------------
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  const r=canvas.getBoundingClientRect();
  W=r.width; H=r.height;
  canvas.width=Math.floor(W*dpr);
  canvas.height=Math.floor(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  applyFlipperPositions();
  resetBall(true);
  buildBoard();
  spawnStage(stage);
}
window.addEventListener("resize", resize);

function makeBar(x,y,len,angle,amp=0.16,speed=1.2){
  return {x,y,len,angle,baseAngle:angle,amp,speed,t:Math.random()*10,thickness:14};
}
function makeMonster(x,y,hp,type,index){
  return {
    x,y,baseX:x,baseY:y,hp,maxHp:hp,
    t:Math.random()*10,
    phase:Math.random()*Math.PI*2,
    type,
    index,
    hitFlash:0
  };
}
function buildBoard(){
  bumpers=[
    {x:W*.16,y:H*.28,r:22},
    {x:W*.84,y:H*.28,r:22},
    {x:W*.33,y:H*.44,r:24},
    {x:W*.67,y:H*.44,r:24},
    {x:W*.50,y:H*.58,r:28}
  ];
  bars=[];
}
function spawnStage(n){
  const configs = [
    {type:"slime",   color:"#f6a21a"},
    {type:"bat",     color:"#a86cff"},
    {type:"beetle",  color:"#55c66f"},
    {type:"ghost",   color:"#56d9ff"},
    {type:"golem",   color:"#e66d55"},
    {type:"horned",  color:"#ffd24f"}
  ];

  // Stageごとに少しずつ数を増やす。最大7体。
  const count = Math.min(3 + Math.floor((n-1)/2), 7);

  // HPは序盤は分かりやすく、後半ほどしっかり増える。
  const baseHp = n <= 2 ? n : 2 + Math.floor((n-1)*0.8);

  const slots = [
    [0.18,0.14],[0.50,0.17],[0.82,0.14],
    [0.30,0.30],[0.70,0.30],
    [0.20,0.43],[0.80,0.43]
  ];

  monsters = [];
  for(let i=0;i<count;i++){
    const cfg = configs[(n+i-1)%configs.length];
    let hp = baseHp;

    // 5ステージごとに強敵を混ぜる
    if(n>=5 && i===0) hp += Math.ceil(n*0.6);

    const [px,py]=slots[i];
    const m = makeMonster(W*px,H*py,hp,cfg.type,i);
    m.color = cfg.color;
    m.scale = (n>=5 && i===0) ? 1.28 : 1.0;
    m.moveMode = n<=1 ? "still" :
                 n<=3 ? (i%2===0 ? "horizontal":"still") :
                 n<=5 ? (i%3===0 ? "vertical":"horizontal") :
                         (i%3===0 ? "vertical" : i%3===1 ? "horizontal" : "orbit");
    monsters.push(m);
  }

  stageMessageTimer = 1.8;
  applyFlipperPositions();
  updateHud();
}
function resetBall(initial=false){
  ball.x=W*.5; ball.y=H-130;
  ball.vx=initial?0:(Math.random()>.5?1:-1)*115;
  ball.vy=initial?0:-325;
}
function startGame(){
  try{ initAudio(); }catch(e){}
  score=0; lives=3; stage=1;
  flipperShift=0; applyFlipperPositions();
  particles=[]; debris=[]; combo=0; comboTimer=0;
  buildBoard(); spawnStage(stage); resetBall(false);
  running=true;
  startScreen.classList.remove("show");
  gameOver.classList.remove("show");
  updateHud(); try{ startMusic(); }catch(e){}
}
startBtn.onclick=startGame;
retryBtn.onclick=startGame;

function updateHud(){
  stageEl.textContent="STAGE " + stage;
  scoreEl.textContent="SCORE " + String(score).padStart(6,"0");
  livesEl.textContent="CORE × " + lives;
}
function setInput(side,val){
  if(side==="left") leftPressed=val; else rightPressed=val;
}
for(const [id,side] of [["leftBtn","left"],["rightBtn","right"]]){
  const el=document.getElementById(id);
  el.addEventListener("pointerdown", e=>{ e.preventDefault(); setInput(side,true); sfx.flip(); });
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>el.addEventListener(ev,()=>setInput(side,false)));
}
canvas.addEventListener("pointerdown", e=>{
  if(!running) return;

  const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left;
  const y=e.clientY-rect.top;

  // 下部のフリッパー周辺はドラッグで横移動。
  if(y>H*.72){
    const rules=stageRules();
    if(rules.movable){
      flipperDragging=true;
      flipperDragStartX=x;
      flipperShiftStart=flipperShift;
      try{canvas.setPointerCapture(e.pointerId);}catch(err){}
      return;
    }
  }

  // 上側をタップした時は従来どおり左右フリップ。
  setInput(x<W/2?"left":"right", true);
  sfx.flip();
});

canvas.addEventListener("pointermove", e=>{
  if(!flipperDragging) return;
  const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left;
  flipperShift=flipperShiftStart+(x-flipperDragStartX);
  applyFlipperPositions();
});

canvas.addEventListener("pointerup", e=>{
  leftPressed=false;
  rightPressed=false;
  flipperDragging=false;
  try{canvas.releasePointerCapture(e.pointerId);}catch(err){}
});

canvas.addEventListener("pointercancel", ()=>{
  leftPressed=false;
  rightPressed=false;
  flipperDragging=false;
});

// ------------ COLLISION ------------
function collideCircle(obj,power=1.08,points=50){
  let dx=ball.x-obj.x, dy=ball.y-obj.y;
  let d=Math.hypot(dx,dy);
  const min=ball.r+obj.r;
  if(d<min && d>0){
    const nx=dx/d, ny=dy/d;
    ball.x=obj.x+nx*min; ball.y=obj.y+ny*min;
    const dot=ball.vx*nx+ball.vy*ny;
    if(dot<0){ ball.vx-=2*dot*nx; ball.vy-=2*dot*ny; }
    ball.vx*=power; ball.vy*=power;
    score+=points; shake=5; addGlowBurst(ball.x,ball.y,8);
    return true;
  }
  return false;
}
function collideMonster(m){
  // circle-ish collision for monster body
  const r = 26 * (m.scale || 1);
  let dx=ball.x-m.x, dy=ball.y-m.y;
  let d=Math.hypot(dx,dy);
  const min=ball.r+r;
  if(d<min && d>0){
    const nx=dx/d, ny=dy/d;
    ball.x=m.x+nx*min; ball.y=m.y+ny*min;
    const dot=ball.vx*nx+ball.vy*ny;
    if(dot<0){ ball.vx-=2*dot*nx; ball.vy-=2*dot*ny; }
    ball.vx*=1.01; ball.vy*=1.01;
    speedUpBall(360);
    score += 100;
    shake = 6;
    addGlowBurst(ball.x,ball.y,10,"#ffe3ad");
    return true;
  }
  return false;
}
function collideSegmentBar(bar){
  const x1=bar.x - Math.cos(bar.angle)*bar.len/2;
  const y1=bar.y - Math.sin(bar.angle)*bar.len/2;
  const x2=bar.x + Math.cos(bar.angle)*bar.len/2;
  const y2=bar.y + Math.sin(bar.angle)*bar.len/2;
  const vx=x2-x1, vy=y2-y1;
  const wx=ball.x-x1, wy=ball.y-y1;
  const t=clamp((wx*vx+wy*vy)/(vx*vx+vy*vy),0,1);
  const px=x1+t*vx, py=y1+t*vy;
  let dx=ball.x-px, dy=ball.y-py;
  let d=Math.hypot(dx,dy);
  const min=ball.r+bar.thickness/2;
  if(d<min){
    if(d===0){ dx=0; dy=-1; d=1; }
    const nx=dx/d, ny=dy/d;
    ball.x=px+nx*min; ball.y=py+ny*min;

    // 補助バーは方向を変える程度。主役は下のメインフリッパー。
    const dot=ball.vx*nx+ball.vy*ny;
    if(dot<0){
      ball.vx-=2*dot*nx;
      ball.vy-=2*dot*ny;
    }
    ball.vx += nx*55;
    ball.vy += ny*55;
    speedUpBall(390);
    const sp=Math.hypot(ball.vx,ball.vy), maxSp=760;
    if(sp>maxSp){
      ball.vx = ball.vx/sp*maxSp;
      ball.vy = ball.vy/sp*maxSp;
    }

    score += 30;
    shake = 5;
    addGlowBurst(ball.x,ball.y,6,"#bdf8ff");
    sfx.bar();
    return true;
  }
  return false;
}
function collideFlipper(f,pressed){
  const target=pressed?f.active:f.rest;
  f.angle += (target-f.angle)*0.38;

  const x2=f.x+Math.cos(f.angle)*f.len;
  const y2=f.y+Math.sin(f.angle)*f.len;
  const vx=x2-f.x, vy=y2-f.y;
  const wx=ball.x-f.x, wy=ball.y-f.y;
  const t=clamp((wx*vx+wy*vy)/(vx*vx+vy*vy),0,1);
  const px=f.x+t*vx, py=f.y+t*vy;
  const dx=ball.x-px, dy=ball.y-py;
  const d=Math.hypot(dx,dy), min=ball.r+8;

  if(d<min && d>0 && ball.vy>-850){
    const nx=dx/d, ny=dy/d;
    ball.x=px+nx*min;
    ball.y=py+ny*min;

    // 先端で打つほど大きく飛ぶ。タップ中はさらに強い。
    const tipPower = 0.72 + t*0.95;
    const pressPower = pressed ? 1.0 : 0.62;
    const launch = 335 * tipPower * pressPower;

    // 基本は強く上方向へ。左右のフリッパーで少し横方向も付ける。
    const side = (f===flippers.left ? 1 : -1);
    ball.vx = ball.vx*0.45 + side*(105 + 115*t) + nx*launch*0.30;
    ball.vy = -Math.max(360, 400 + 150*t) - Math.abs(ny)*launch*0.16;

    // フリッパー先端なら画面上部まで届く速度を保証。
    const rules=stageRules();
    const minLaunchSpeed = pressed ? (t>0.65 ? rules.bounceMax : rules.bounceMin) : 390;
    speedUpBall(minLaunchSpeed);

    const sp=Math.hypot(ball.vx,ball.vy), maxSp=760;
    if(sp>maxSp){
      ball.vx=ball.vx/sp*maxSp;
      ball.vy=ball.vy/sp*maxSp;
    }

    score+=15;
    shake=pressed ? 7 : 4;
    addGlowBurst(ball.x,ball.y,pressed?9:5,"#c9fbff");
  }
}
function damageMonster(m){
  if(m.hp<=0) return;
  m.hp--;
  m.hitFlash=.14;
  combo++;
  comboTimer=1.25;
  score += 150 * combo;
  addDebris(m.x+rand(-8,8),m.y+rand(-8,8),"#ffca63",12,4);
  shake = 7;
  if(m.hp<=0){
    score += 600;
    addDebris(m.x,m.y,"#ffe7a8",26,7);
    addGlowBurst(m.x,m.y,24,"#fff1bd");
    sfx.down();
  }else{
    sfx.crack();
    sfx.hit();
  }
}

// ------------ UPDATE ------------
function update(dt){
  if(!running) return;

  comboTimer -= dt;
  if(comboTimer<=0){ comboTimer=0; combo=0; }
  if(stageMessageTimer>0) stageMessageTimer -= dt;

  monsters.forEach(m=>{
    m.t += dt;
    if(m.hitFlash>0) m.hitFlash -= dt;

    const difficulty = Math.min(stage,10);
    const ampX = 10 + difficulty*2.5;
    const ampY = 7 + difficulty*1.6;
    const speed = 0.9 + difficulty*0.09;

    if(m.moveMode==="horizontal"){
      m.x = m.baseX + Math.sin(m.t*speed + m.phase)*ampX;
      m.y = m.baseY;
    }else if(m.moveMode==="vertical"){
      m.x = m.baseX;
      m.y = m.baseY + Math.sin(m.t*speed + m.phase)*ampY;
    }else if(m.moveMode==="orbit"){
      m.x = m.baseX + Math.cos(m.t*speed + m.phase)*ampX*.8;
      m.y = m.baseY + Math.sin(m.t*speed + m.phase)*ampY*.8;
    }else{
      m.x = m.baseX;
      m.y = m.baseY;
    }
  });

  ball.vy += 485*dt;
  ball.x += ball.vx*dt;
  ball.y += ball.vy*dt;

  if(ball.x-ball.r<12){ ball.x=12+ball.r; ball.vx=Math.abs(ball.vx)*.94; }
  if(ball.x+ball.r>W-12){ ball.x=W-12-ball.r; ball.vx=-Math.abs(ball.vx)*.94; }
  if(ball.y-ball.r<10){ ball.y=10+ball.r; ball.vy=Math.abs(ball.vy)*.94; }

  // ステージが進むほどガイドが短くなり、落下ゾーンが広がる。
  const rules=stageRules();
  if(ball.y>H-150 && ball.y<H-74){
    const leftGuideY = H-134 + (ball.x-18)*0.18;
    const rightGuideY = H-134 + (W-18-ball.x)*0.18;

    if(ball.x<W*rules.guideEnd && ball.y>leftGuideY && ball.vy>0){
      ball.y=leftGuideY-2;
      ball.vy=-Math.abs(ball.vy)*0.52;
      ball.vx+=42;
    }

    if(ball.x>W*(1-rules.guideEnd) && ball.y>rightGuideY && ball.vy>0){
      ball.y=rightGuideY-2;
      ball.vy=-Math.abs(ball.vy)*0.52;
      ball.vx-=42;
    }
  }

  const leftDrainR=W*rules.sideDrain;
  const centerDrainL=W*(.5-rules.centerDrain);
  const centerDrainR=W*(.5+rules.centerDrain);
  const rightDrainL=W*(1-rules.sideDrain);

  if(ball.y>H-70){
    const inLeftDrain = ball.x < leftDrainR;
    const inCenterDrain = ball.x > centerDrainL && ball.x < centerDrainR;
    const inRightDrain = ball.x > rightDrainL;
    if(inLeftDrain || inCenterDrain || inRightDrain){
      ball.y=H+60;
    }
  }

  collideFlipper(flippers.left,leftPressed);
  collideFlipper(flippers.right,rightPressed);
  bumpers.forEach(b=>{ if(collideCircle(b,1.035,80)) sfx.bumper(); });

  monsters.forEach(m=>{
    if(m.hp>0 && collideMonster(m)){
      damageMonster(m);
    }
  });

  if(monsters.every(m=>m.hp<=0)){
    stage++;
    sfx.stage();
    spawnStage(stage);
    resetBall(false);
  }

  if(ball.y>H+40){
    lives--;
    combo=0; comboTimer=0;
    sfx.lost();
    updateHud();
    if(lives<=0){
      running=false;
      stopMusic();
      sfx.gameover();
      resultTitle.textContent="SYSTEM DOWN";
      finalScore.textContent="SCORE "+score;
      gameOver.classList.add("show");
    }else{
      resetBall(false);
    }
  }

  particles.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=180*dt; p.life-=dt; });
  particles = particles.filter(p=>p.life>0);

  debris.forEach(d=>{ d.x+=d.vx*dt; d.y+=d.vy*dt; d.vy+=220*dt; d.rot+=d.vr*dt; d.life-=dt; });
  debris = debris.filter(d=>d.life>0);

  shake *= .86;
  updateHud();
}

// ------------ DRAW ------------
function drawBoard(){
  const theme=stageTheme();
  const g=ctx.createLinearGradient(0,0,0,H);

  if(theme==="color"){
    g.addColorStop(0,"#39145f");
    g.addColorStop(.25,"#123e6d");
    g.addColorStop(.5,"#0d605b");
    g.addColorStop(.75,"#654515");
    g.addColorStop(1,"#4a1747");
  }else if(theme==="fire"){
    g.addColorStop(0,"#40120b");
    g.addColorStop(.45,"#1d0c09");
    g.addColorStop(1,"#090504");
  }else if(theme==="neon"){
    g.addColorStop(0,"#17134a");
    g.addColorStop(.5,"#071e3e");
    g.addColorStop(1,"#05101d");
  }else{
    g.addColorStop(0,"#0d2237");
    g.addColorStop(1,"#06101d");
  }

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  // カラフル / 炎ステージの追加演出
  if(theme==="color"){
    const bands=["rgba(255,80,170,.10)","rgba(90,240,255,.10)","rgba(255,220,80,.10)"];
    bands.forEach((c,i)=>{
      ctx.fillStyle=c;
      ctx.fillRect(0,H*(.18+i*.22),W,H*.10);
    });
  }else if(theme==="fire"){
    for(let i=0;i<10;i++){
      const x=(i+.5)*W/10;
      const h=22+((i*17)%35);
      const fg=ctx.createLinearGradient(0,H-h,0,H);
      fg.addColorStop(0,"rgba(255,220,90,0)");
      fg.addColorStop(.5,"rgba(255,100,20,.18)");
      fg.addColorStop(1,"rgba(255,40,10,.35)");
      ctx.fillStyle=fg;
      ctx.beginPath();
      ctx.moveTo(x-18,H);
      ctx.quadraticCurveTo(x-8,H-h*.6,x,H-h);
      ctx.quadraticCurveTo(x+10,H-h*.55,x+18,H);
      ctx.closePath();
      ctx.fill();
    }
  }

  ctx.strokeStyle="rgba(94,221,255,.08)";
  ctx.lineWidth=1;
  for(let y=30;y<H;y+=34){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  for(let x=20;x<W;x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }

  ctx.strokeStyle="rgba(101,233,255,.45)";
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(12,H); ctx.lineTo(12,48);
  ctx.quadraticCurveTo(12,12,48,12);
  ctx.lineTo(W-48,12);
  ctx.quadraticCurveTo(W-12,12,W-12,48);
  ctx.lineTo(W-12,H);
  ctx.stroke();
}
function drawFlipper(f){
  const x2=f.x+Math.cos(f.angle)*f.len, y2=f.y+Math.sin(f.angle)*f.len;
  ctx.strokeStyle="#75efff"; ctx.lineWidth=15; ctx.lineCap="round"; ctx.shadowBlur=14; ctx.shadowColor="#2bdcff";
  ctx.beginPath(); ctx.moveTo(f.x,f.y); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.shadowBlur=0; ctx.strokeStyle="rgba(255,255,255,.65)"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(f.x,f.y); ctx.lineTo(x2,y2); ctx.stroke();
}
function drawBar(bar){
  const x1=bar.x - Math.cos(bar.angle)*bar.len/2;
  const y1=bar.y - Math.sin(bar.angle)*bar.len/2;
  const x2=bar.x + Math.cos(bar.angle)*bar.len/2;
  const y2=bar.y + Math.sin(bar.angle)*bar.len/2;
  ctx.strokeStyle="#66efff"; ctx.lineWidth=bar.thickness; ctx.lineCap="round"; ctx.shadowBlur=18; ctx.shadowColor="#2bdcff";
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.shadowBlur=0; ctx.strokeStyle="rgba(255,255,255,.75)"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.fillStyle="rgba(180,250,255,.9)";
  ctx.beginPath(); ctx.arc(bar.x,bar.y,4.5,0,Math.PI*2); ctx.fill();
}
function drawBumper(b){
  const gg=ctx.createRadialGradient(b.x-6,b.y-7,4,b.x,b.y,b.r);
  gg.addColorStop(0,"#ffffff");
  gg.addColorStop(.12,"#a7f8ff");
  gg.addColorStop(.45,"#23cce7");
  gg.addColorStop(1,"#103b5e");
  ctx.fillStyle=gg;
  ctx.shadowBlur=18; ctx.shadowColor="#3de9ff";
  ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle="rgba(255,255,255,.65)";
  ctx.lineWidth=2;
  ctx.stroke();
}
function drawMonster(m){
  if(m.hp<=0) return;

  const hpRatio = m.hp / m.maxHp;
  const damage = 1-hpRatio;
  const s = m.scale || 1;

  ctx.save();
  ctx.translate(m.x,m.y);
  ctx.scale(s,s);

  if(m.hitFlash>0){
    ctx.shadowBlur=30;
    ctx.shadowColor="#ffffff";
  }else{
    ctx.shadowBlur=16;
    ctx.shadowColor=m.color;
  }

  const c=m.color;

  // 種類ごとにシルエットを変える
  if(m.type==="slime"){
    ctx.fillStyle=c;
    ctx.beginPath();
    ctx.moveTo(-24,14);
    ctx.quadraticCurveTo(-28,-12,0,-24);
    ctx.quadraticCurveTo(28,-12,24,14);
    ctx.quadraticCurveTo(12,24,0,18);
    ctx.quadraticCurveTo(-12,24,-24,14);
    ctx.fill();
  }else if(m.type==="bat"){
    ctx.fillStyle=c;
    ctx.beginPath();
    ctx.moveTo(-8,-10);
    ctx.quadraticCurveTo(-22,-26,-32,-10);
    ctx.lineTo(-20,-4);
    ctx.lineTo(-30,8);
    ctx.quadraticCurveTo(-14,12,-5,6);
    ctx.quadraticCurveTo(0,18,5,6);
    ctx.quadraticCurveTo(14,12,30,8);
    ctx.lineTo(20,-4);
    ctx.lineTo(32,-10);
    ctx.quadraticCurveTo(22,-26,8,-10);
    ctx.closePath();
    ctx.fill();
  }else if(m.type==="beetle"){
    ctx.fillStyle=c;
    ctx.beginPath();
    ctx.ellipse(0,2,22,28,0,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,.3)";
    ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(0,26);ctx.stroke();
    ctx.lineWidth=4;
    [-12,0,12].forEach(y=>{
      ctx.beginPath();ctx.moveTo(-18,y);ctx.lineTo(-31,y-7);ctx.stroke();
      ctx.beginPath();ctx.moveTo(18,y);ctx.lineTo(31,y-7);ctx.stroke();
    });
  }else if(m.type==="ghost"){
    ctx.fillStyle=c;
    ctx.beginPath();
    ctx.arc(0,-3,23,Math.PI,0);
    ctx.lineTo(23,18);
    ctx.lineTo(12,11);
    ctx.lineTo(3,20);
    ctx.lineTo(-7,11);
    ctx.lineTo(-18,20);
    ctx.lineTo(-23,18);
    ctx.closePath();
    ctx.fill();
  }else if(m.type==="golem"){
    ctx.fillStyle=c;
    ctx.fillRect(-23,-20,46,40);
    ctx.fillStyle="rgba(255,255,255,.15)";
    ctx.fillRect(-18,-15,14,10);
    ctx.fillRect(4,-15,14,10);
    ctx.strokeStyle="rgba(0,0,0,.25)";
    ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(-22,0);ctx.lineTo(-10,8);ctx.lineTo(-2,2);ctx.lineTo(8,10);ctx.stroke();
  }else{
    // horned
    ctx.fillStyle=c;
    ctx.beginPath();
    ctx.moveTo(-22,15);
    ctx.lineTo(-18,-13);
    ctx.lineTo(-28,-28);
    ctx.lineTo(-7,-20);
    ctx.quadraticCurveTo(0,-25,7,-20);
    ctx.lineTo(28,-28);
    ctx.lineTo(18,-13);
    ctx.lineTo(22,15);
    ctx.quadraticCurveTo(0,25,-22,15);
    ctx.fill();
  }

  // damage chips
  if(damage>0.05){
    ctx.save();
    ctx.globalCompositeOperation="destination-out";
    const holes=Math.floor(damage*6);
    for(let i=0;i<holes;i++){
      const rx=-13+(i*9)%26;
      const ry=-10+(i%3)*10;
      ctx.beginPath();
      ctx.arc(rx,ry,3+(i%2),0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  // eyes
  ctx.shadowBlur=0;
  ctx.fillStyle="#fff";
  ctx.fillRect(-10,-5,6,8);
  ctx.fillRect(4,-5,6,8);
  ctx.fillStyle="#1b2530";
  ctx.fillRect(-8,-2,2,4);
  ctx.fillRect(6,-2,2,4);

  // mouth
  ctx.strokeStyle="#2b1b16";
  ctx.lineWidth=3;
  ctx.beginPath();
  if(stage<4){
    ctx.moveTo(-8,9); ctx.quadraticCurveTo(0,14,8,9);
  }else{
    ctx.moveTo(-8,12); ctx.lineTo(-3,8); ctx.lineTo(2,12); ctx.lineTo(7,8);
  }
  ctx.stroke();

  // cracks
  ctx.strokeStyle="rgba(255,255,255,.75)";
  ctx.lineWidth=2;
  for(let i=0;i<Math.floor(damage*5);i++){
    const a=i*1.3+damage;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*5,Math.sin(a)*5);
    ctx.lineTo(Math.cos(a)*15,Math.sin(a)*15);
    ctx.stroke();
  }

  // HP
  ctx.fillStyle="rgba(255,255,255,.95)";
  ctx.font="bold 10px system-ui";
  ctx.textAlign="center";
  ctx.fillText(String(m.hp),0,-34);

  ctx.fillStyle="rgba(255,255,255,.16)";
  ctx.fillRect(-18,30,36,4);
  ctx.fillStyle=c;
  ctx.fillRect(-18,30,36*hpRatio,4);

  ctx.restore();
}
function drawBall(){
  const orb=ctx.createRadialGradient(ball.x-4,ball.y-5,2,ball.x,ball.y,ball.r);
  orb.addColorStop(0,"#fff"); orb.addColorStop(.24,"#b5fbff"); orb.addColorStop(.55,"#42d7ff"); orb.addColorStop(1,"#2454d8");
  ctx.fillStyle=orb; ctx.shadowBlur=22; ctx.shadowColor="#66ecff";
  ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
}
function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life/.7);
    ctx.fillStyle=p.color || "#9bf5ff";
    ctx.fillRect(p.x,p.y,p.size,p.size);
  });
  debris.forEach(d=>{
    ctx.save();
    ctx.globalAlpha=Math.max(0,d.life/.9);
    ctx.translate(d.x,d.y);
    ctx.rotate(d.rot);
    ctx.fillStyle=d.color;
    ctx.fillRect(-d.size/2,-d.size/2,d.size,d.size*.78);
    ctx.restore();
  });
  ctx.globalAlpha=1;
}
function drawMessages(){
  if(running){
    ctx.fillStyle="rgba(190,245,255,.72)";
    ctx.textAlign="center";
    ctx.font="700 11px system-ui";
    const rules=stageRules();
    if(rules.movable){
      ctx.fillText("フリッパー付近を左右ドラッグで移動", W/2, H-18);
    }else{
      ctx.fillText("序盤はフリッパー固定", W/2, H-18);
    }
  }
  if(stageMessageTimer>0){
    ctx.fillStyle="rgba(255,255,255,.92)";
    ctx.textAlign="center";
    ctx.font="900 26px system-ui";
    const themeName=stageTheme()==="color"?"COLOR STAGE":stageTheme()==="fire"?"FIRE STAGE":stageTheme()==="neon"?"NEON STAGE":"STAGE "+stage;
    ctx.fillText(themeName, W/2, H*.11);
    ctx.font="700 14px system-ui";
    ctx.fillStyle="rgba(255,235,180,.9)";
    ctx.fillText("ENEMIES " + monsters.length + " / HP " + monsters[0].maxHp, W/2, H*.145);
  }
  if(combo>1 && comboTimer>0){
    ctx.fillStyle="rgba(255,245,200,.95)";
    ctx.textAlign="center";
    ctx.font="900 22px system-ui";
    ctx.fillText(combo + " COMBO!", W/2, H*.72);
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);

  drawBoard();
  bumpers.forEach(drawBumper);
  monsters.forEach(drawMonster);

  const rules=stageRules();

  // ステージ進行でガイドが短くなる
  ctx.strokeStyle="#36759a";
  ctx.lineWidth=5;
  ctx.beginPath();
  ctx.moveTo(18,H-128);
  ctx.lineTo(W*rules.guideEnd,H-103);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(W-18,H-128);
  ctx.lineTo(W*(1-rules.guideEnd),H-103);
  ctx.stroke();

  // 落下ゾーンを表示
  const drainZones=[
    [0,W*rules.sideDrain],
    [W*(.5-rules.centerDrain),W*(.5+rules.centerDrain)],
    [W*(1-rules.sideDrain),W]
  ];
  const dg=ctx.createLinearGradient(0,H-82,0,H);
  dg.addColorStop(0,"rgba(255,95,95,.04)");
  dg.addColorStop(1,"rgba(255,25,45,.20)");
  ctx.fillStyle=dg;
  drainZones.forEach(([x1,x2])=>{
    ctx.fillRect(x1,H-72,x2-x1,72);
  });
  drawFlipper(flippers.left);
  drawFlipper(flippers.right);
  drawBall();
  drawParticles();
  drawMessages();

  ctx.restore();
}

function loop(ts){
  const dt=Math.min((ts-last)/1000 || 0, .025);
  last=ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
resize();
requestAnimationFrame(loop);

window.startGame = startGame;

</script>
